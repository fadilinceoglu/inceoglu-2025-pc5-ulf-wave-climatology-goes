[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inceoglu-2025-pc5-ulf-wave-climatology-goes"
version = "1.0.0"
description = "Occurrence characteristics and amplitude-frequency relationship of the Pc5 ULF waves from 3 decades of GOES data"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Fadil Inceoglu"},
  {name = "Paul T. M. Loto’aniu"},
]
dependencies = [
  "joblib==1.3.2",
  "matplotlib==3.5.3",
  "numpy==1.26.3",
  "pandas==1.5.3",
  "scipy==1.11.4",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
full = [
  "aiohttp==3.13.5",
  "beautifulsoup4==4.12.2",
  "netCDF4==1.6.5",
  "spacepy==0.7.0",
]
dev = [
  "pytest>=7,<9",
  "ruff>=0.8,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.urls]
Article = "https://doi.org/10.1038/s41598-025-20474-z"
Repository = "https://github.com/fadilinceoglu/inceoglu-2025-pc5-ulf-wave-climatology-goes"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
